# Standalone Rust application workspace for unmodified Pi Coding Agent.
# Compatible version requirements, not exact (=) pins. Cargo.lock records the
# resolved versions and is committed after a successful local bootstrap.
[workspace]
resolver = "3"
members = ["crates/pi-rpc", "crates/tui-shell"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
license = "MIT"

[workspace.dependencies]
serde_json = "1"
ratatui = "0.30"
crossterm = "0.29"
pi-rpc = { path = "crates/pi-rpc" }

[workspace.lints.rust]
unsafe_code = "forbid"
